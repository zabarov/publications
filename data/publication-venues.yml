schema_version: "1.0.0"
updated: "2026-10-24"

canonical_policy:
  primary_source: "Canonical URL is recorded per publication; this repository preserves author-approved copies independently of the venue."
  cross_posting: "Cross-post only public-safe versions and preserve canonical/source links where the platform supports it."
  privacy: "Do not publish private SIMAI logs, customer data, credentials, raw prompts, private graph evidence or unpublished scientific claims."

venues:
  - id: "habr"
    name: "Habr"
    language: "Russian"
    track: "technical-community"
    role: "Technical community venue for Russian-language engineering articles."
    canonical_use: "Habr remains canonical for Habr-first articles; archive author-approved published text and assets in this repository."
    suitable_for:
      - "AI-assisted engineering practice"
      - "developer workflow articles"
      - "technical retrospectives"
    public_url: "https://habr.com/"
    author_guidelines_url: "https://habr.com/ru/docs/authors/"
    notes: "Metadata uses English; archived article texts retain their published language."

  - id: "hackernoon"
    name: "HackerNoon"
    language: "en"
    track: "international"
    role: "Candidate editorial channel for adapted English technology articles."
    canonical_use: "Record the published URL and edition relationship after acceptance."
    public_url: "https://hackernoon.com/"
    notes: "A planned placement is not an accepted submission. Earlier English editions must be distinguished from current Russian revisions."

  - id: "medium"
    name: "Medium"
    language: "en"
    track: "international"
    role: "International longform essays and accessible explanations for AI, product and engineering readers."
    canonical_use: "Use as cross-post or English edition; set canonical link to the repository/site when applicable."
    suitable_for:
      - "conceptual essays"
      - "AI workflow retrospectives"
      - "public-safe Mirai Graph summaries"
    public_url: "https://medium.com/"
    author_guidelines_url: "https://help.medium.com/"
    notes: "Medium supports canonical links and imported stories; keep AI-assisted authorship transparent when relevant."

  - id: "hashnode"
    name: "Hashnode"
    language: "en"
    track: "international"
    role: "Developer-focused blog with markdown, GitHub-oriented workflow and optional custom domain."
    canonical_use: "Good secondary developer channel for English technical posts."
    suitable_for:
      - "developer workflow articles"
      - "tooling notes"
      - "public implementation patterns"
    public_url: "https://hashnode.com/"
    author_guidelines_url: "https://docs.hashnode.com/"
    notes: "Useful if GitHub-backed markdown publishing becomes important."

  - id: "dev-to"
    name: "DEV Community"
    language: "en"
    track: "international"
    role: "Developer community channel for practical, code-adjacent articles."
    canonical_use: "Use for condensed technical versions with canonical/source links."
    suitable_for:
      - "how-to articles"
      - "implementation patterns"
      - "developer lessons"
    public_url: "https://dev.to/"
    author_guidelines_url: "https://dev.to/p/editor_guide"
    notes: "Best for pragmatic developer takeaways, not long private-methodology essays."

  - id: "infoq"
    name: "InfoQ"
    language: "en"
    track: "international"
    role: "Selective professional software-development outlet."
    canonical_use: "Submit polished English articles after the core public series proves value."
    suitable_for:
      - "software architecture"
      - "AI engineering practice"
      - "organizational knowledge systems"
    public_url: "https://www.infoq.com/"
    author_guidelines_url: "https://www.infoq.com/guidelines/"
    notes: "Requires stronger editorial framing and less personal-process detail."

  - id: "acm-queue"
    name: "ACM Queue"
    language: "en"
    track: "professional"
    role: "High-bar professional software engineering venue."
    canonical_use: "Target only after a mature, evidence-backed essay exists."
    suitable_for:
      - "software engineering practice"
      - "human-AI workflow architecture"
      - "systems of expertise"
    public_url: "https://queue.acm.org/"
    author_guidelines_url: "https://authors.acm.org/magazines/queue"
    notes: "Best for a refined article, not early exploratory notes."

  - id: "ssrn"
    name: "SSRN"
    language: "en"
    track: "academic"
    role: "Preprint and working paper channel for research-grade material."
    canonical_use: "Use for research papers before referencing scientific claims in public articles."
    suitable_for:
      - "state-tone-index"
      - "evolutionary graph research"
      - "formal methodology papers"
    public_url: "https://www.ssrn.com/"
    author_guidelines_url: "https://www.elsevier.support/ssrn/"
    notes: "Blog articles should wait for SSRN approval before making research claims."
